<div class="login-container">
    <img src="blu.png" alt="Blue Shape" class="shape blue-shape">
    <img src="verde.png" alt="Green Shape" class="shape green-shape">

    <div class="login-content">
        <div class="logo-container">
            <img src="logo-packovery 1.png" alt="Packovery Logo" class="logo">
        </div>

        <h2 class="title">Codice di conferma</h2>
        <p class="subtitle">Inserisci il codice a 6 che ti abbiamo inviato per email.
            <br>Se l'utente esiste riceverai codice di conferma.
        </p>

        <form class="login-form"
            (submit)="onFormSubmit(d0.value, d1.value, d2.value, d3.value, d4.value, d5.value, $event)">
            <div class="form-group">
                <label for="code1">Codice</label>
                <div class="code-inputs">
                    <input type="text" maxlength="1" class="form-control code-input" #d0 [value]="digits[0]"
                        name="digit0" (keyup)="onKeyUp($event, 0)" (paste)="onPaste($event)">
                    <input type="text" maxlength="1" class="form-control code-input" #d1 [value]="digits[1]"
                        name="digit1" (keyup)="onKeyUp($event, 1)">
                    <input type="text" maxlength="1" class="form-control code-input" #d2 [value]="digits[2]"
                        name="digit2" (keyup)="onKeyUp($event, 2)">
                    <input type="text" maxlength="1" class="form-control code-input" #d3 [value]="digits[3]"
                        name="digit3" (keyup)="onKeyUp($event, 3)">
                    <input type="text" maxlength="1" class="form-control code-input" #d4 [value]="digits[4]"
                        name="digit4" (keyup)="onKeyUp($event, 4)">
                    <input type="text" maxlength="1" class="form-control code-input" #d5 [value]="digits[5]"
                        name="digit5" (keyup)="onKeyUp($event, 5)">
                </div>
            </div>

            @if (errorMessage) {
            <div class="error-message">
                {{ errorMessage }}
            </div>
            }

            @if (successMessage) {
            <div class="success-message">
                {{ successMessage }}
            </div>
            }

            <div class="button-group">
                <button type="button" class="btn btn-cancel" routerLink="/forgot-password">Annulla</button>
                <button type="submit" class="btn btn-submit" [disabled]="isLoading">
                    @if (isLoading) {
                    <div class="spinner"></div>
                    }
                    <span>{{ isLoading ? 'Verifica...' : 'Conferma' }}</span>
                </button>
            </div>

            <div class="resend-section">
                <p>Il codice scade dopo 15 minuti.</p>
                <button type="button" class="btn-text" (click)="resendCode()" [disabled]="isResending">
                    {{ isResending ? 'Invio in corso...' : 'Invia un nuovo codice' }}
                </button>
            </div>
        </form>
    </div>
</div>
