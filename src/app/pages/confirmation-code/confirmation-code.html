<div class="login-container">
    <img src="blu.png" alt="Blue Shape" class="shape blue-shape">
    <img src="verde.png" alt="Green Shape" class="shape green-shape">

    <div class="login-content">
        <div class="logo-container">
            <img src="logo-packovery 1.png" alt="Packovery Logo" class="logo">
        </div>

        <h2 class="title">Codice di conferma</h2>
        <p class="subtitle">Inserisci il codice a 6 che ti abbiamo inviato per email.</p>
        <button type="button" class="btn-link" (click)="resendCode()">Invia di nuovo email</button>

        <form class="login-form">
            <div class="form-group">
                <label for="code1">Codice</label>
                <div class="code-inputs">
                    <input type="text" maxlength="1" class="form-control code-input">
                    <input type="text" maxlength="1" class="form-control code-input">
                    <input type="text" maxlength="1" class="form-control code-input">
                    <input type="text" maxlength="1" class="form-control code-input">
                    <input type="text" maxlength="1" class="form-control code-input">
                    <input type="text" maxlength="1" class="form-control code-input">
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" routerLink="/forgot-password">Annulla</button>
                <button type="button" class="btn btn-submit">Conferma</button>
            </div>
        </form>
    </div>
</div>
