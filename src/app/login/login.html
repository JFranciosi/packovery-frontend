<div class="login-container">
    <img src="blu.png" alt="Blue Shape" class="shape blue-shape">
    <img src="verde.png" alt="Green Shape" class="shape green-shape">

    <div class="login-content">
        <div class="logo-container">
            <img src="logo-packovery 1.png" alt="Packovery Logo" class="logo">
        </div>

        <h2 class="title">Accedi</h2>

        <form class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control">
            </div>

            <div class="forgot-password">
                <a href="/forgot-password">Password Dimenticata?</a>
            </div>

            <button type="button" class="btn-submit">Accedi</button>
        </form>
    </div>
</div>
