<div class="login-container">
    <img src="blu.png" alt="Blue Shape" class="shape blue-shape">
    <img src="verde.png" alt="Green Shape" class="shape green-shape">

    <div class="login-content">
        <div class="logo-container">
            <img src="logo-packovery 1.png" alt="Packovery Logo" class="logo">
        </div>

        <h2 class="title">Inserisci la tua email</h2>
        <p class="subtitle">Inserisci l'email del tuo account.<br>Ti invieremo un codice per modificare la tua password.
        </p>

        <form class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" [(ngModel)]="email">
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" routerLink="/">Annulla</button>
                <button type="button" class="btn btn-submit" (click)="onSubmit()" [disabled]="isLoading">
                    @if (isLoading) {
                    <div class="spinner"></div>
                    }
                    <span>{{ isLoading ? 'Invio in corso...' : 'Invia Codice' }}</span>
                </button>
            </div>
        </form>
    </div>
</div>
