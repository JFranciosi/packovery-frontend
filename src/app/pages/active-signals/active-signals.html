<div class="layout-container">
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="60" rx="15" fill="white" />
                <path d="M0 15C0 6.71573 6.71573 0 15 0H45C53.2843 0 60 6.71573 60 15V30H0V15Z" fill="#9ACD32" />
                <path d="M0 30H60V45C60 53.2843 53.2843 60 45 60H15C6.71573 60 0 53.2843 0 45V30Z" fill="#4A69BD" />
                <rect x="18" y="18" width="24" height="24" rx="8" fill="white" />
                <circle cx="30" cy="12" r="4" fill="#4A69BD" />
                <circle cx="30" cy="48" r="4" fill="#9ACD32" />
            </svg>
        </div>
        <button class="menu-toggle" (click)="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <div class="sidebar-overlay" [class.open]="isSidebarOpen" (click)="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="isSidebarOpen">
        <div class="logo-container">
            <div class="logo">
                <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="60" height="60" rx="15" fill="white" />
                    <path d="M0 15C0 6.71573 6.71573 0 15 0H45C53.2843 0 60 6.71573 60 15V30H0V15Z" fill="#9ACD32" />
                    <path d="M0 30H60V45C60 53.2843 53.2843 60 45 60H15C6.71573 60 0 53.2843 0 45V30Z" fill="#4A69BD" />
                    <rect x="18" y="18" width="24" height="24" rx="8" fill="white" />
                    <circle cx="30" cy="12" r="4" fill="#4A69BD" />
                    <circle cx="30" cy="48" r="4" fill="#9ACD32" />
                </svg>
            </div>
            <div class="logo-name">Packovery</div>
        </div>

        <nav class="nav-menu">
            <a class="nav-item" routerLink="/order-search">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <span>Ricerca ordine</span>
            </a>
            <a class="nav-item active" routerLink="/active-signals">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </span>
                <span>Segnalazioni attive</span>
            </a>
            <a class="nav-item" routerLink="/alert-configurator">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </span>
                <span>Configuratore alert</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a class="nav-item cursor-pointer logout-item" (click)="logout()">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </span>
                Esci
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <h2 class="page-title">Segnalazioni ricevute</h2>

        <div class="signals-list">
            @for (s of signals; track s.id) {
            <div class="signal-card">
                <div class="signal-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="signal-info">
                    <div class="signal-header">
                        <h3>ID ordine: {{ s.id }}</h3>
                        <span class="alert-id">ID alert: {{ s.alertId }}</span>
                    </div>
                    <div class="signal-desc">{{ s.description }}</div>
                    <div class="signal-time">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        {{ s.time }}
                    </div>
                </div>
                <div class="signal-action">
                    <button class="btn-resolve" (click)="resolveSignal(s)">
                        Risolvi
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
            }
        </div>
    </main>
</div>
