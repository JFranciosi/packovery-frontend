<div class="map-section">
    <div class="map-container" [class.fullscreen]="isFullscreen">
        <!-- Leaflet Map -->
        <div id="map" style="height: 100%; width: 100%;"></div>

        <button class="fullscreen-toggle" (click)="toggleFullscreen()" [title]="isFullscreen ? 'Riduci' : 'Espandi'">
            @if (!isFullscreen) {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
            } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
            </svg>
            }
        </button>
    </div>
    <div class="map-info-bar">
        <div class="info-segment">
            <label>Luogo di partenza</label>
            <div class="value">{{ departure?.address }}</div>
        </div>
        <div class="info-segment">
            <label>Posizione attuale</label>
            <div class="value">{{ currentPosition?.coords }}</div>
        </div>
        <div class="info-segment">
            <label>Luogo di arrivo</label>
            <div class="value">{{ arrival?.address }}</div>
        </div>
    </div>
</div>
