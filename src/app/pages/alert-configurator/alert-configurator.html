<div class="layout-container">
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="60" rx="15" fill="white" />
                <path d="M0 15C0 6.71573 6.71573 0 15 0H45C53.2843 0 60 6.71573 60 15V30H0V15Z" fill="#9ACD32" />
                <path d="M0 30H60V45C60 53.2843 53.2843 60 45 60H15C6.71573 60 0 53.2843 0 45V30Z" fill="#4A69BD" />
                <rect x="18" y="18" width="24" height="24" rx="8" fill="white" />
                <circle cx="30" cy="12" r="4" fill="#4A69BD" />
                <circle cx="30" cy="48" r="4" fill="#9ACD32" />
            </svg>
        </div>
        <button class="menu-toggle" (click)="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <app-sidebar [isOpen]="isSidebarOpen" (close)="toggleSidebar()"></app-sidebar>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <h2 class="page-title">Configuratore alert</h2>
            <button class="btn-new" routerLink="/alert-creation">
                Nuovo alert
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-name">Nome</th>
                        <th class="col-date">Data creazione</th>
                        <th class="col-type">Tipologia</th>
                        <th class="col-threshold">Soglia</th>
                        <th class="col-status">Stato</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (alert of alerts; track $index) {
                    <tr>
                        <td class="col-name" data-label="Nome">{{ alert.name }}</td>
                        <td class="col-date" data-label="Data creazione">{{ alert.createdDate }}</td>
                        <td class="col-type" data-label="Tipologia">{{ alert.type }}</td>
                        <td class="col-threshold" data-label="Soglia">{{ alert.threshold }}</td>
                        <td class="col-status" data-label="Stato">
                            <label class="switch">
                                <input type="checkbox" [checked]="alert.status === 'Attivo'"
                                    (change)="toggleStatus(alert)">
                                <span class="slider"></span>
                            </label>
                            <span>{{ alert.status }}</span>
                        </td>
                        <td class="col-actions">
                            <div class="actions">
                                <button class="action-btn edit" (click)="editAlert(alert)">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </button>
                                <button class="action-btn delete" (click)="deleteAlert(alert)">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path
                                            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                        </path>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </main>
</div>
