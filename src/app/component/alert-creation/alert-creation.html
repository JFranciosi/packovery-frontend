<div class="layout-container">
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="60" rx="15" fill="white" />
                <path d="M0 15C0 6.71573 6.71573 0 15 0H45C53.2843 0 60 6.71573 60 15V30H0V15Z" fill="#9ACD32" />
                <path d="M0 30H60V45C60 53.2843 53.2843 60 45 60H15C6.71573 60 0 53.2843 0 45V30Z" fill="#4A69BD" />
                <rect x="18" y="18" width="24" height="24" rx="8" fill="white" />
                <circle cx="30" cy="12" r="4" fill="#4A69BD" />
                <circle cx="30" cy="48" r="4" fill="#9ACD32" />
            </svg>
        </div>
        <button class="menu-toggle" (click)="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <div class="sidebar-overlay" [class.open]="isSidebarOpen" (click)="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="isSidebarOpen">
        <div class="logo-container">
            <div class="logo">
                <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="60" height="60" rx="15" fill="white" />
                    <path d="M0 15C0 6.71573 6.71573 0 15 0H45C53.2843 0 60 6.71573 60 15V30H0V15Z" fill="#9ACD32" />
                    <path d="M0 30H60V45C60 53.2843 53.2843 60 45 60H15C6.71573 60 0 53.2843 0 45V30Z" fill="#4A69BD" />
                    <rect x="18" y="18" width="24" height="24" rx="8" fill="white" />
                    <circle cx="30" cy="12" r="4" fill="#4A69BD" />
                    <circle cx="30" cy="48" r="4" fill="#9ACD32" />
                </svg>
            </div>
            <div class="logo-name">Packovery</div>
        </div>

        <nav class="nav-menu">
            <a class="nav-item" routerLink="/order-search">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <span>Ricerca ordine</span>
            </a>
            <a class="nav-item" routerLink="/active-signals">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </span>
                <span>Segnalazioni attive</span>
            </a>
            <a class="nav-item active" routerLink="/alert-configurator">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </span>
                <span>Configuratore alert</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a class="nav-item cursor-pointer logout-item" (click)="logout()">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </span>
                <span>Esci</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">Crea nuovo alert</h1>
            <button class="btn-back" routerLink="/alert-configurator">
                Torna indietro
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="flip-icon">
                    <polyline points="9 14 4 9 9 4"></polyline>
                    <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
                </svg>
            </button>
        </div>

        <div class="form-container">
            <!-- Tipologia -->
            <div class="form-group">
                <label>Tipologia</label>
                <div class="type-selector">
                    @for (t of alertTypes; track t) {
                    <button class="type-btn" [class.selected]="alert.type === t" (click)="selectType(t)">
                        {{ t }}
                    </button>
                    }
                </div>
            </div>

            <!-- Nome -->
            <div class="form-group">
                <label>Nome</label>
                <input type="text" [(ngModel)]="alert.name" placeholder="Inserisci nome alert">
            </div>

            <!-- Descrizione -->
            <div class="form-group">
                <label>Descrizione</label>
                <textarea [(ngModel)]="alert.description" rows="4"
                    placeholder="Inserisci una descrizione..."></textarea>
            </div>

            <!-- Soglia -->
            <div class="form-group">
                <label>Soglia</label>
                <div class="threshold-wrapper">
                    <input type="text" [(ngModel)]="alert.threshold" class="threshold-input">
                    <div class="quick-add-buttons">
                        <button type="button" (click)="addTime(0.5)">+0.5h</button>
                        <button type="button" (click)="addTime(1)">+1h</button>
                        <button type="button" (click)="addTime(2)">+2h</button>
                    </div>
                </div>
            </div>

            <!-- Stato -->
            <div class="form-group">
                <label>Stato</label>
                <div class="status-toggle-wrapper">
                    <label class="switch">
                        <input type="checkbox" [(ngModel)]="alert.active">
                        <span class="slider round"></span>
                    </label>
                    <span class="status-label">{{ alert.active ? 'Attivo' : 'Non attivo' }}</span>
                </div>
            </div>

            <!-- Action -->
            <div class="form-actions">
                <button class="btn-create" (click)="createAlert()">
                    Crea alert
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>

        </div>
    </main>
</div>
