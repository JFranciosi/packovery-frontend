<div class="login-container">
    <img src="blu.png" alt="Blue Shape" class="shape blue-shape">
    <img src="verde.png" alt="Green Shape" class="shape green-shape">

    <div class="login-content">
        <div class="logo-container">
            <img src="logo-packovery 1.png" alt="Packovery Logo" class="logo">
        </div>

        <h2 class="title">Nuova Password</h2>

        <form class="login-form">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Conferma Password</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-control"
                    [(ngModel)]="confirmPassword">
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" routerLink="/">Annulla</button>
                <button type="button" class="btn btn-submit" (click)="onSubmit()">Conferma</button>
            </div>
        </form>
    </div>
</div>
